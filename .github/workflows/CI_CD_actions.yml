name: Tests

on:
  push:
    tags:
      - v**
    branches-ignore:
      - "dependabot/**"
      - "sourcery/**"
      - "pre-commit-ci-update-config"
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup conda
        uses: s-weigand/setup-conda@v1
        with:
          conda-channels: conda-forge
          activate-conda: false
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: |
          conda install -y pandoc
          uv sync --frozen --group docs
      - name: Show installed packages
        run: uv pip list
      - name: Build docs
        run: |
          just docs/clean
          just docs/html

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup conda
        uses: s-weigand/setup-conda@v1
        with:
          conda-channels: conda-forge
          activate-conda: false
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: |
          conda install -y pandoc
          uv sync --frozen --group docs
      - name: Show installed packages
        run: uv pip list
      - name: Check doc links
        run: |
          just docs/clean
          just docs/linkcheck | tee linkcheck-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Linkcheck summary
        if: ${{ always() }}
        run: grep -E "(\(line.*\)|writing output)" < linkcheck-output.txt

  docs-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          conda install -y pandoc
          uv sync --frozen --group docs
      - name: Show installed packages
        run: uv pip list
      - name: Run notebooks
        run: |
          uv run python docs/remove_notebook_written_data.py
          uv run pytest -vv --nbval docs/source/notebooks

  test:
    runs-on: ${{ matrix.os }}
    needs: [pre-commit]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --group test
      - name: Show installed packages
        run: uv pip list
      - name: Run tests
        run: |
          uv run pytest --cov=./ --cov-report term --cov-report xml --cov-config pyproject.toml tests

      - name: Codecov Upload
        uses: codecov/codecov-action@v4
        # Coverage upload is informational; a Codecov outage must not fail the test job.
        continue-on-error: true
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [test, docs, docs-notebooks]
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build dist
        run: |
          uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
