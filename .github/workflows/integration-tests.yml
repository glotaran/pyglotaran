name: "Run Examples"

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "sourcery/**"
      - "pre-commit-ci-update-config"
  pull_request:
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  create-example-list:
    name: Create Example List
    runs-on: ubuntu-latest
    outputs:
      example-list: ${{ steps.create-example-list.outputs.example-list }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned examples
        uses: actions/checkout@v4
        with:
          repository: "glotaran/pyglotaran-examples"
          ref: fcfe1519ac3a49e1826318646dfdda7892d0bbf1
          path: pyglotaran-examples
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked example-list dependencies
        run: |
          uv pip install --no-deps --only-binary :all: --require-hashes \
            -r .github/requirements-build-py310.txt
          # yaargh publishes no wheel; its sdist and build toolchain are hash-locked.
          uv pip install --no-deps --only-binary :all: --no-binary yaargh \
            --no-build-isolation --require-hashes \
            -r .github/requirements-example-list-py310.txt
      - name: Set example list output
        id: create-example-list
        run: |
          python pyglotaran-examples/scripts/run_examples_notebooks.py \
            set-gha-example-list-output

  run-examples:
    name: "Run Example: "
    runs-on: ubuntu-latest
    needs: [create-example-list]
    strategy:
      matrix:
        example_name: ${{fromJson(needs.create-example-list.outputs.example-list)}}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned examples
        uses: actions/checkout@v4
        with:
          repository: "glotaran/pyglotaran-examples"
          ref: fcfe1519ac3a49e1826318646dfdda7892d0bbf1
          path: pyglotaran-examples
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv pip install --no-deps --only-binary :all: --require-hashes \
            -r .github/requirements-build-py310.txt
          # odfpy and yaargh publish no wheels; their sdists and build toolchain are hash-locked.
          uv pip install --no-deps --only-binary :all: --no-binary odfpy \
            --no-binary yaargh --no-build-isolation --require-hashes \
            -r .github/requirements-integration-py310.txt
      - name: Build and install pyglotaran
        run: |
          uv build --wheel --no-build-isolation
          uv pip install --no-deps --no-index --only-binary :all: dist/*.whl
      - name: ${{ matrix.example_name }}
        id: example-run
        env:
          EXAMPLE_NAME: ${{ matrix.example_name }}
        run: python pyglotaran-examples/scripts/run_examples_notebooks.py "$EXAMPLE_NAME"
      - name: Record pinned examples revision
        run: |
          examples_sha="$(git -C pyglotaran-examples rev-parse HEAD)"
          test "$examples_sha" = "fcfe1519ac3a49e1826318646dfdda7892d0bbf1"
          mkdir -p "$HOME/pyglotaran_examples_results" pyglotaran-examples/plot_results
          printf '%s\n' "$examples_sha" | tee \
            "$HOME/pyglotaran_examples_results/example_commit_sha.txt" \
            pyglotaran-examples/plot_results/example_commit_sha.txt
      - name: Installed packages
        if: always()
        run: |
          uv pip list
      - name: Upload Example Plots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-notebooks-${{ matrix.example_name }}
          path: ${{ steps.example-run.outputs.notebook-path }}

      - name: Upload Example Results
        uses: actions/upload-artifact@v4
        with:
          name: example-results-${{ matrix.example_name }}
          path: ~/pyglotaran_examples_results

  collect-artifacts:
    if: always()
    name: "Collect artifacts and reupload as bundle"
    runs-on: ubuntu-latest
    needs: [run-examples]
    steps:
      - name: Download Notebooks Artifacts
        uses: actions/download-artifact@v4
        with:
          path: example-notebooks
          pattern: example-notebooks-*
          merge-multiple: true

      - name: Upload Example Notebooks Artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-notebooks
          path: example-notebooks
          overwrite: true

      - name: Delete Intermediate Notebooks artifacts
        uses: GeekyEggo/delete-artifact@v5
        with:
          name: example-notebooks-*

      - name: Download Result Artifacts
        uses: actions/download-artifact@v4
        with:
          path: example-results
          pattern: example-results-*
          merge-multiple: true

      - name: Upload Example Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-results
          path: example-results
          overwrite: true

      - name: Delete Intermediate Result artifacts
        uses: GeekyEggo/delete-artifact@v5
        with:
          name: example-results-*

  compare-results:
    name: Compare Results
    runs-on: ubuntu-latest
    needs: [collect-artifacts]
    steps:
      - name: Checkout pyglotaran and pinned validation action
        uses: actions/checkout@v4
        with:
          path: pyglotaran
          submodules: recursive

      - name: Checkout compare results
        uses: actions/checkout@v4
        with:
          repository: "glotaran/pyglotaran-examples"
          # Pinned v0.7 gold standard. Refresh this only with a reviewed
          # comparison-results publication and update its provenance record.
          ref: 88d10b162359a95b7e2baa80f9108797a59e2c66
          path: comparison-results

      - name: Download result artifact
        uses: actions/download-artifact@v4
        with:
          name: example-results
          path: comparison-results-current

      - name: Delete Intermediate artifacts
        uses: GeekyEggo/delete-artifact@v5
        with:
          name: example-results-*

      - name: Show used versions for result creation
        run: |
          echo "::group:: ✔️ Compare-Results"
          echo "✔️ pyglotaran-examples commit: $(< comparison-results/example_commit_sha.txt)"
          echo "✔️ pyglotaran commit: $(< comparison-results/pyglotaran_commit_sha.txt)"
          echo "::endgroup::"
          echo "::group:: ♻️ Current-Results"
          echo "♻️ pyglotaran-examples commit: $(< comparison-results-current/example_commit_sha.txt)"
          echo "::endgroup::"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run result validator
        uses: ./pyglotaran/validation
        with:
          validation_name: pyglotaran-examples
